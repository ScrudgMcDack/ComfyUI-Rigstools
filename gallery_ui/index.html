<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicoTeka</title>
<link rel="icon" type="image/svg+xml" href="/rigstools/gallery/assets/picox.svg">
<link rel="stylesheet" href="/rigstools/gallery/assets/gallery.css">
</head>
<body>
<div class="top">
  <div class="logo"><span class="mark" id="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span data-t="title"></span></div>
  <label class="search"><svg class="ic"></svg><input class="inp" id="q" type="search"><button class="sclear" id="q-clear" type="button" hidden></button></label>
  <!-- the sort: our own drop-down, so the list is drawn as the fields (the browser list cannot be styled) -->
  <div class="dd" id="sort"><button class="inp dd-btn" type="button" aria-haspopup="listbox"><svg class="ic"></svg><span class="dd-v"></span>
    <svg class="ic dd-chev"></svg></button><div class="dd-menu" role="listbox" hidden></div></div>
  <!-- the thumbnail size, as the zoom of Windows 11: presets in %, − / +, a round slider -->
  <div class="zoom" id="zoom"><span class="zl" data-t="size"></span>
</div>
  <div class="sp"></div>
  <button class="btn" id="b-rate"></button><button class="btn" id="b-tags"></button><button class="btn" id="b-move"></button>
  <button class="btn dang" id="b-del"></button><button class="btn pri" id="b-compare"></button>
  <button class="btn" id="rescan"></button>
</div>
<div class="body">
  <div class="side" id="side">
    <div class="fold"><div class="h"><span data-t="folders"></span></div><div class="tree" id="tree"></div><div class="tree-add" id="add-folder"></div></div>
    <!-- the filters: the other half of the panel, with their own scrolling -->
    <div class="filters">
      <div id="f-model"></div>
      <div id="f-lora"></div>
      <div id="f-sampler"></div>
      <div id="f-tag"></div>
      <div><div class="h"><span data-t="rating"></span><a id="rating-clear"></a></div><div class="stars" id="rating"></div></div>
      <div><div class="h"><span data-t="date"></span><a id="date-clear"></a></div>
        <div class="dates">
          <label class="date"><input class="inp" type="date" id="from"><span class="ph" data-t="dateFrom"></span><svg class="ic"></svg></label>
          <label class="date"><input class="inp" type="date" id="to"><span class="ph" data-t="dateTo"></span><svg class="ic"></svg></label>
        </div></div>
    </div>
  </div>
  <div class="split" id="split-side"></div>
  <!-- the main area: the flickering pixels of picox.club behind the grid -->
  <div class="mainwrap"><canvas class="px" id="px" aria-hidden="true"></canvas>
    <div class="main" id="main"><div class="fresh-wrap"><button class="fresh" id="fresh" hidden></button></div><div class="grid" id="grid"></div><div class="sentinel" id="sentinel"></div></div></div>
  <div class="split" id="split-card"></div>
  <div class="card" id="card"></div>
</div>
<div class="status"><span id="st-scan"></span><span id="st-index"></span><span class="sp"></span><span id="st-shown"></span>
  <!-- the GitHub mark from Simple Icons (CC0), see THIRD_PARTY_NOTICES.md -->
  <a class="gh" id="gh" href="https://github.com/ScrudgMcDack/ComfyUI-Rigstools" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"
    fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></a></div>
<div class="viewer" id="viewer" hidden>
  <div class="v-stage" id="v-stage">
    <img id="v-img" alt="" draggable="false">
    <div class="v-top"><button class="btn" id="v-close"></button><b class="ttl" id="v-title"></b><div class="sp"></div>
      <div class="btn" id="v-rate"></div><button class="btn" id="v-tags"></button>
      <button class="btn" id="v-img-wf"></button><button class="btn" id="v-par-wf"></button><button class="btn dang" id="v-del"></button>
      <button class="btn" id="v-fit"></button><div class="zoom" id="v-zoomctl"></div><button class="btn" id="v-info"></button></div>
    <button class="v-nav" id="v-prev">‹</button><button class="v-nav r" id="v-next">›</button>
    <div class="v-mini" id="v-mini" hidden><img id="v-mini-img" alt=""><i id="v-mini-frame"></i></div>
    <div class="v-zoom" id="v-zoom"></div>
    <div class="v-bot"><span id="v-file"></span><span class="sp"></span><label><input type="checkbox" id="v-keep"> <span id="v-keep-l"></span></label>
      <span id="v-pos"></span><span class="hint" id="v-hint"><button class="hint-ic" type="button"></button><span class="hint-t"></span></span></div>
  </div>
  <div class="split" id="split-view"></div>
  <div class="v-panel" id="v-panel"></div>
</div>
<div class="compare" id="compare" hidden>
  <div class="c-top"><button class="btn" id="c-close"></button><b class="ttl" id="c-title"></b><div class="sp"></div>
    <span class="hint" id="c-hint"><button class="hint-ic" type="button"></button><span class="hint-t"></span></span><div class="seg"><span id="c-side"></span><span id="c-slider"></span></div><button class="btn" id="c-fit"></button><div class="zoom" id="c-zoomctl"></div>
    <label class="muted"><input type="checkbox" id="c-hide"> <span id="c-hide-l"></span></label></div>
  <div class="c-stage" id="c-stage"><img id="c-img-a" alt="" draggable="false"><img id="c-img-b" alt="" draggable="false">
    <div class="c-handle" id="c-handle"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-4-4"/><path d="M20 15H4l4 4"/></svg></i></div><span class="c-lab a" id="c-lab-a"></span><span class="c-lab b" id="c-lab-b"></span>
</div>
  <div class="hsplit" id="c-split"></div>
  <div class="c-table" id="c-table"></div>
</div>
<script type="module" src="/rigstools/gallery/assets/gallery.js"></script>
</body>
</html>
